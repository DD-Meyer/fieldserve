services:
  db:
    image: postgis/postgis:15-3.3
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./fieldserve_backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./fieldserve_backend:/app
    restart: unless-stopped

  ml:
    build: ./ml_service
    env_file: .env
    ports:
      - "8001:8001"
    volumes:
      - ./ml_service:/app
    restart: unless-stopped

  scheduler:
    build: ./fieldserve_backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_started
    volumes:
      - ./fieldserve_backend:/app
    command: ["python", "manage.py", "run_scheduler"]
    restart: unless-stopped

volumes:
  postgres_data:
