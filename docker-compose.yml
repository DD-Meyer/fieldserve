services:
  db:
    image: postgis/postgis:15-3.3
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./fieldserve_backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./fieldserve_backend:/app
      - ./fieldserve_backend/exports:/exports
    restart: unless-stopped

  ml:
    build: ./ml_service
    env_file: .env
    ports:
      - "8001:8001"
    volumes:
      - ./ml_service:/app
      - ./fieldserve_backend/exports:/exports
    restart: unless-stopped

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    profiles: ["routing"]
    volumes:
      - ./osrm-data:/data
    command: >
      sh -c "
      if [ ! -f /data/planet.osrm ]; then
        echo 'Missing /data/planet.osrm. Download an OSM extract and place it at /data/planet.osm.pbf before starting OSRM.';
        exit 1;
      fi;
      osrm-routed --algorithm mld --port 5000 /data/planet.osrm"
    restart: unless-stopped
    stop_grace_period: 30s

  scheduler:
    build: ./fieldserve_backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_started
    volumes:
      - ./fieldserve_backend:/app
      - ./fieldserve_backend/exports:/exports
    command: ["python", "manage.py", "run_scheduler"]
    restart: unless-stopped

  celery:
    build: ./fieldserve_backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./fieldserve_backend:/app
      - ./fieldserve_backend/exports:/exports
    environment:
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "core", "worker", "--loglevel=INFO"]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
