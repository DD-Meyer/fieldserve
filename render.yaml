version: "1"

databases:
  - name: fieldserve-db
    databaseName: fieldserve
    user: fieldserve_user
    region: frankfurt
    plan: basic-256mb # Updated from 'starter' to current Render DB instance plan

services:
  # 1. Private ML Service
  - type: pserv
    name: fieldserve-ml
    runtime: docker
    region: frankfurt
    rootDir: ml_service
    dockerfilePath: ./Dockerfile
    plan: standard
    envVars:
      - key: ML_INTERNAL_TOKEN
        generateValue: true

  # 2. Public Django Backend
  - type: web
    name: fieldserve-backend
    runtime: docker
    region: frankfurt
    rootDir: fieldserve_backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /admin/
    envVars:
      - key: PORT
        value: "8000"
      # Database connection parameters
      - key: DATABASE_URL
        fromDatabase:
          name: fieldserve-db
          property: connectionString
      - key: POSTGRES_DB
        fromDatabase:
          name: fieldserve-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: fieldserve-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: fieldserve-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: fieldserve-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: fieldserve-db
          property: port

      # Internal ML service connection
      - key: ML_SERVICE_URL
        fromService:
          name: fieldserve-ml
          type: pserv
          property: hostport
      - key: ML_INTERNAL_TOKEN
        fromService:
          name: fieldserve-ml
          type: pserv
          envVarKey: ML_INTERNAL_TOKEN

      # Django configuration
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: fieldserve-backend.onrender.com

      # External integrations (set manually in Render UI)
      - key: DJANGO_CORS_ORIGINS
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false